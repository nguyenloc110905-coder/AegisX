[project]
name = "aegisx-agent"
version = "0.1.0"
description = "AegisX Linux endpoint telemetry agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28,<1",
  "psutil>=7,<8",
  "pydantic-settings>=2.7,<3",
  "structlog>=24.4,<26",
]

[dependency-groups]
dev = ["mypy>=1.14,<2", "pytest>=8.3,<9", "ruff>=0.9,<1", "types-psutil>=7,<8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegisx_agent"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/aegisx_agent"]
